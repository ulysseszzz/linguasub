<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icon {
    width: 128px; height: 128px;
    border-radius: 28px;
    background: linear-gradient(135deg, #6d5cff 0%, #3f7cff 55%, #16c4f0 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .bubble {
    width: 86px; height: 62px; border-radius: 16px;
    background: rgba(255,255,255,0.16);
    border: 3px solid rgba(255,255,255,0.92);
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 0 10px;
  }
  .bubble::after {
    content: ""; position: absolute; bottom: 18px; left: 36px;
    width: 14px; height: 14px;
    background: rgba(255,255,255,0.92);
    clip-path: polygon(0 0, 100% 0, 0 100%);
    border-bottom-left-radius: 4px;
  }
  .a { color: #fff; font: bold 30px -apple-system, "Segoe UI", Arial, sans-serif; }
  .arrow { color: #ffe27a; font: bold 20px -apple-system, "Segoe UI", Arial, sans-serif; }
  .han { color: #ffe27a; font: bold 30px "PingFang SC", "Hiragino Sans GB", sans-serif; }
</style>
</head>
<body>
<div class="icon">
  <div class="bubble"><span class="a">A</span><span class="arrow">→</span><span class="han">文</span></div>
</div>
</body>
</html>
